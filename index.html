<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بدون تلميح</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(135deg,#1a0b2e,#2d1452);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;text-align:center}
  button{touch-action:manipulation;cursor:pointer}
  button:active{transform:scale(0.96)}
  .scr{display:none;width:100%;max-width:410px;flex-direction:column;gap:14px}
  .scr.act{display:flex}
  h1{font-size:2.4rem;color:#ffd166;text-shadow:0 3px 10px rgba(0,0,0,0.4)}
  .box{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:18px;padding:14px}
  .row{display:flex;gap:8px;margin-top:8px}
  .btn{flex:1;padding:11px;border-radius:12px;border:2px solid rgba(255,255,255,0.2);background:transparent;color:#fff;font-weight:700;font-size:1rem}
  .btn.sel{background:#ffd166;color:#1a0b2e;border-color:#ffd166}
  .go{background:linear-gradient(90deg,#06d6a0,#00b4d8);color:#1a0b2e;border:0;padding:15px;border-radius:14px;font-size:1.25rem;font-weight:900}
  .t-bar{display:flex;gap:10px}
  .tb{flex:1;padding:10px;border-radius:12px;font-weight:900;opacity:0.45;border:2px solid transparent}
  .tb.on{opacity:1;border-color:#ffd166}
  .card{background:#fdf8ee;color:#1a0b2e;border-radius:24px;padding:24px 16px;box-shadow:0 12px 30px rgba(0,0,0,0.4)}
  .fbox{background:#fce8e8;border:2px dashed #ef476f;border-radius:14px;padding:12px;margin-top:16px}
  .fw{display:inline-block;background:#fff;color:#d90429;padding:5px 12px;border-radius:8px;margin:4px;font-weight:700;font-size:1.05rem}
</style>
</head>
<body>
<div id="s1" class="scr act">
  <h1>بدون تلميح</h1>
  <div class="box"><div>نظام اللعب</div><div class="row"><button class="btn sel" id="mT" onclick="setM('t')">تحدي الفريقين ⚔️</button><button class="btn" id="mS" onclick="setM('s')">لعب حر 👤</button></div></div>
  <div class="box" id="bG"><div>نقاط الفوز</div><div class="row"><button class="btn sel" id="g15" onclick="setG(15)">15</button><button class="btn" id="g25" onclick="setG(25)">25</button><button class="btn" id="g40" onclick="setG(40)">40</button></div></div>
  <div class="box"><div>مدة الجولة (ثانية)</div><div class="row"><button class="btn" id="t30" onclick="setT(30)">30</button><button class="btn sel" id="t60" onclick="setT(60)">60</button><button class="btn" id="t90" onclick="setT(90)">90</button></div></div>
  <button class="go" onclick="start()">ابدأ اللعب الآن 🚀</button>
</div>
<div id="s2" class="scr">
  <h1 id="tTxt">🔵 دور الفريق الأزرق</h1>
  <div class="box"><p style="font-size:1.2rem">الأزرق: <b id="pB">0</b> | الأحمر: <b id="pR">0</b></p><p style="color:#ffd166;margin-top:10px">سلّم الهاتف للاعب الذي سيشرح الكلمة</p></div>
  <button class="go" onclick="play()">ابدأ المؤقت ⏱️</button>
</div>
<div id="s3" class="scr">
  <div class="t-bar" id="tBar"><div class="tb on" id="bB" style="background:#00b4d833;color:#48cae4">🔵 الأزرق: <span id="sB">0</span></div><div class="tb" id="bR" style="background:#ef476f33;color:#ff758f">🔴 الأحمر: <span id="sR">0</span></div></div>
  <div class="box" style="display:flex;justify-content:space-between;align-items:center"><span id="gLbl" style="color:#ffd166;font-weight:700">الهدف: 15</span><span id="sLbl" style="display:none">النقاط: <b id="sS">0</b></span><b id="tmr" style="font-size:1.9rem;color:#ffd166">60</b></div>
  <div class="card"><div style="color:#888;font-size:0.85rem">✦ الكلمة المطلوبة ✦</div><div id="wM" style="font-size:2.5rem;font-weight:900;margin:10px 0">قهوة</div><div class="fbox"><div style="color:#ef476f;font-size:0.85rem;font-weight:700">🚫 ممنوع تقول</div><div id="wF"></div></div></div>
  <div class="row"><button class="go" style="background:#ef476f;color:#fff" onclick="nxt(0)">تخطي ✖</button><button class="go" onclick="nxt(1)">صحيحة ✔ (+1)</button></div>
</div>
<div id="s4" class="scr">
  <h1 id="eT">انتهى الوقت!</h1>
  <div class="box"><p id="eS">النتيجة</p><h1 id="eN" style="font-size:3.2rem;color:#06d6a0;margin-top:8px">0</h1></div>
  <button class="go" onclick="go('s1')">العب مجدداً 🔄</button>
</div>
<script>
var raw = `قهوة:فنجان,كافيين,صباح|شمس:سماء,نور,حرارة|قمر:ليل,نجوم,بدر|بحر:ماء,مالح,سمك|جبل:عالي,قمة,صخور|سيارة:عجلات,قيادة,شارع|هاتف:اتصال,شاشة,تطبيق|كتاب:قراءة,ورق,مكتبة|ساعة:وقت,عقارب,يد|مفتاح:باب,قفل,فتح|نظارة:عين,رؤية,شمس|حذاء:قدم,مشي,رباط|سرير:نوم,وسادة,غرفة|ثلاجة:بارد,طعام,مطبخ|تلفاز:شاشة,قنوات,ريموت|طائرة:سفر,سماء,مطار|قطار:سكة,محطة,سريع|كرة قدم:ملعب,هدف,حارس|طبيب:مستشفى,مريض,علاج|معلم:مدرسة,طالب,سبورة|فيل:خرطوم,كبير,أنياب|زرافة:رقبة,طويلة,بقع|بطريق:ثلج,طائر,أبيض|تمساح:نهر,أسنان,أخضر|برجر:لحم,خبز,مطعم|موز:أصفر,قرد,فاكهة|تفاح:أحمر,شجرة,نيوتن|فراولة:أحمر,بذور,مربى|ليمون:حامض,أصفر,عصير|بصل:دموع,طبخ,رائحة|بطاطس:قلي,شيبس,أرض|إطفائي:نار,ماء,حريق|مهندس:بناء,تصميم,خوذة|طيار:طائرة,سماء,قيادة|حلاق:شعر,مقص,مشط|خياط:قماش,إبرة,ملابس|ميكانيكي:سيارة,تصليح,محرك|صيدلي:دواء,وصفة,علاج|شاحن:كهرباء,سلك,هاتف|مكيف:برد,صيف,هواء|غسالة:ملابس,ماء,تنظيف|مكنسة:غبار,تنظيف,أرض|مكواة:ملابس,حرارة,فرد|فرشاة أسنان:معجون,فم,تنظيف|منشفة:ماء,تجفيف,حمام|عطر:رائحة,زجاجة,رش|محفظة:نقود,بطاقة,جيب|علم:دولة,ألوان,سارية|خريطة:دول,اتجاهات,موقع|بوصلة:شمال,جنوب,اتجاه|تلسكوب:نجوم,فضاء,رؤية|مجهر:صغير,مختبر,تكبير|سلم:صعود,درج,ارتفاع|مصعد:عمارة,زر,طوابق|إشارة مرور:أحمر,أخضر,سيارات|وقود:بنزين,سيارة,محطة|عجلة:دائرية,سيارة,مطاط`;

var words = raw.trim().split('|').filter(Boolean).map(function(item) {
  var parts = item.split(':');
  return { w: parts[0].trim(), f: parts[1] ? parts[1].split(',') : [] };
});

var mode = 't', goal = 15, timeSet = 60;
var scoreB = 0, scoreR = 0, scoreS = 0, turn = 'B';
var timer = null, timeLeft = 60, used = [];

function go(id) {
  document.querySelectorAll('.scr').forEach(function(s) { s.classList.remove('act'); });
  document.getElementById(id).classList.add('act');
}

function setM(m) {
  mode = m;
  document.getElementById('mT').classList.toggle('sel', m === 't');
  document.getElementById('mS').classList.toggle('sel', m === 's');
  document.getElementById('bG').style.display = (m === 't') ? 'block' : 'none';
}

function setG(g) {
  goal = g;
  [15, 25, 40].forEach(function(x) {
    document.getElementById('g' + x).classList.toggle('sel', x === g);
  });
}

function setT(t) {
  timeSet = t;
  [30, 60, 90].forEach(function(x) {
    document.getElementById('t' + x).classList.toggle('sel', x === t);
  });
}

function start() {
  scoreB = 0; scoreR = 0; scoreS = 0; turn = 'B'; used = [];
  if (mode === 't') {
    prepTurn();
  } else {
    play();
  }
}

function prepTurn() {
  document.getElementById('tTxt').innerText = (turn === 'B') ? '🔵 دور الفريق الأزرق' : '🔴 دور الفريق الأحمر';
  document.getElementById('pB').innerText = scoreB;
  document.getElementById('pR').innerText = scoreR;
  go('s2');
}

function play() {
  timeLeft = timeSet;
  document.getElementById('tmr').innerText = timeLeft;
  document.getElementById('tBar').style.display = (mode === 't') ? 'flex' : 'none';
  document.getElementById('gLbl').style.display = (mode === 't') ? 'inline' : 'none';
  document.getElementById('gLbl').innerText = 'الهدف: ' + goal;
  document.getElementById('sLbl').style.display = (mode === 's') ? 'inline' : 'none';
  updateScores();
  nextWord();
  go('s3');
  clearInterval(timer);
  timer = setInterval(function() {
    timeLeft--;
    document.getElementById('tmr').innerText = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(timer);
      endRound();
    }
  }, 1000);
}

function updateScores() {
  document.getElementById('sB').innerText = scoreB;
  document.getElementById('sR').innerText = scoreR;
  document.getElementById('sS').innerText = scoreS;
  document.getElementById('bB').classList.toggle('on', turn === 'B');
  document.getElementById('bR').classList.toggle('on', turn === 'R');
}

function nextWord() {
  if (used.length >= words.length) used = [];
  var idx;
  do {
    idx = Math.floor(Math.random() * words.length);
  } while (used.indexOf(idx) !== -1);
  used.push(idx);
  var item = words[idx];
  document.getElementById('wM').innerText = item.w;
  var fHtml = '';
  item.f.forEach(function(fw) {
    fHtml += '<span class="fw">' + fw + '</span>';
  });
  document.getElementById('wF').innerHTML = fHtml;
}

function nxt(ok) {
  if (ok) {
    if (mode === 't') {
      if (turn === 'B') scoreB++; else scoreR++;
      updateScores();
      if (scoreB >= goal || scoreR >= goal) {
        clearInterval(timer);
        showWinner();
        return;
      }
    } else {
      scoreS++;
      updateScores();
    }
  }
  nextWord();
}

function endRound() {
  if (mode === 't') {
    turn = (turn === 'B') ? 'R' : 'B';
    prepTurn();
  } else {
    document.getElementById('eT').innerText = 'انتهى الوقت! ⏱️';
    document.getElementById('eS').innerText = 'مجموع نقاطك';
    document.getElementById('eN').innerText = scoreS;
    go('s4');
  }
}

function showWinner() {
  var winTeam = (scoreB >= goal) ? '🔵 فاز الفريق الأزرق!' : '🔴 فاز الفريق الأحمر!';
  document.getElementById('eT').innerText = winTeam;
  document.getElementById('eS').innerText = 'النتيجة النهائية';
  document.getElementById('eN').innerText = scoreB + ' - ' + scoreR;
  go('s4');
}
</script>
</body>
</html>
